# Oraclarr with the Docker socket proxy that get_containers and stack_health read from.
# Copy to docker-compose.yml, then: docker compose up -d
# All Oraclarr settings come from the sibling .env file (start from .env.example).
# Without the proxy, use docker-compose.example.yml instead.
#
# Before you deploy:
#   1. Run `stat -c '%g' /var/run/docker.sock` on the host and put the number in `user:` below.
#   2. Set ORACLARR_DOCKER_URL=http://docker-proxy:2375 in .env.
# Netdata (for get_host) is not part of this stack. It is reached over a URL; see docs/host-metrics.md.
services:
  oraclarr:
    image: ghcr.io/bdog720/oraclarr-mcp:latest
    container_name: oraclarr
    restart: unless-stopped
    ports:
      - "7979:7979"           # host:container — change the host side freely
    env_file: .env
    depends_on:
      - docker-proxy

  docker-proxy:
    image: wollomatic/socket-proxy:1.13.1
    container_name: docker-proxy
    restart: unless-stopped
    user: "65534:<docker group id>"   # nobody : the gid of /var/run/docker.sock
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Keep the single quotes: the backslash in the regex must survive YAML.
    # Only GET is allowed, and only for: version, ping, the container list, one
    # container's details and its logs. Everything else is refused (405/403).
    command:
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      - '-allowfrom=oraclarr'          # must match the Oraclarr service name above
      - '-allowGET=(/v1\.[0-9]+)?/(version|_ping|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs))'
      - '-allowhealthcheck'
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 2
