# Copy to docker-compose.yml, then: docker compose up -d
# All settings come from the sibling .env file (start from .env.example).
services:
  oraclarr:
    image: ghcr.io/bdog720/oraclarr-mcp:latest
    container_name: oraclarr
    restart: unless-stopped
    ports:
      - "7979:7979"           # host:container — change the host side freely
    env_file: .env
    # Optional: a config.yaml as well as (or instead of) .env. .env wins.
    # volumes:
    #   - ./config.yaml:/config/config.yaml:ro
