name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      # The history is public: every author and committer must be a GitHub noreply address.
      - name: Check commit emails
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="${RANGE#*..}~1..${RANGE#*..}";; esac
          bad="$(git log --format='%h %ae%n%h %ce' "$RANGE" \
            | grep -vE ' ([^ ]+@users\.noreply\.github\.com|noreply@github\.com)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::commits with an email that is not a GitHub noreply address:"
            echo "$bad" | cut -d' ' -f1 | sort -u
            exit 1
          fi
